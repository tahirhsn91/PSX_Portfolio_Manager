# =============================================================================
# PSX Portfolio Manager — Docker Compose
#
# Monorepo layout:
#   frontend/  — React + Vite app (served by Vite dev or Nginx prod)
#   backend/   — Express market-data proxy (forwards to Capital Stake API)
#
# Two profiles:
#   dev   → Vite dev server with HMR on http://localhost:3000
#            + proxy on http://localhost:4000
#   prod  → Multi-stage Nginx build on http://localhost:80
#            + proxy on http://localhost:4000
#
# Quick start (mock data — fully offline):
#   docker compose --profile dev up --build
#
# Quick start (live PSX data — FREE, no API key needed):
#   cp .env.example .env.local    # set VITE_MARKET_PROVIDER=yahoo
#   docker compose --profile dev up --build
#
# Quick start (Capital Stake live data — paid):
#   cp .env.example .env.local    # set CAPITALSTAKE_API_KEY + VITE_MARKET_PROVIDER=capitalstake
#   docker compose --profile dev up --build
# =============================================================================

name: psx-portfolio-manager

services:

  # ── Development: PostgreSQL (auth + portfolio storage) ────────────────────
  db-dev:
    profiles: [dev]
    container_name: psx-db-dev
    image: postgres:16-alpine
    ports:
      - "5432:5432"              # host port is overridden per checkout
    # Credentials come from .env.local (env_file), NOT from ${} interpolation:
    # Compose interpolates from the shell/.env only, so ${POSTGRES_PASSWORD}
    # here would init the DB with a different password than the proxy sends.
    env_file:
      - path: .env.local
        required: true
    volumes:
      # Project-scoped by Compose (no explicit name:) so checkouts never share data
      - pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Development: React app (Vite HMR) ─────────────────────────────────────
  app-dev:
    profiles: [dev]
    container_name: psx-dev
    build:
      context: ./frontend        # build context is the frontend/ subfolder
      dockerfile: Dockerfile.dev
    ports:
      - "3000:5173"              # host:3000 → container:5173 (Vite default)
    volumes:
      # Bind-mount frontend source only — edits reflect instantly via HMR
      - ./frontend:/app
      # Isolate node_modules inside the container (don't override with host copy)
      - node_modules_dev:/app/node_modules
    environment:
      - NODE_ENV=development
      # File-system polling — required for HMR inside Docker on Windows / WSL2
      - CHOKIDAR_USEPOLLING=true
      # VITE_* vars (VITE_MARKET_PROVIDER, VITE_PROXY_BASE_URL, VITE_PSX_SCRAPER_URL) come
      # exclusively from env_file (.env.local) so that .env.local is the single source of truth.
      # Without .env.local the Vite code defaults: provider=mock, proxy=localhost:4000, scraper=localhost:4001
    env_file:
      - path: .env.local
        required: false          # optional — app works without it (mock data)
    depends_on:
      proxy-dev:
        condition: service_healthy
        required: false          # proxy is optional — app silently uses mock if absent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Development: Market data proxy ────────────────────────────────────────
  proxy-dev:
    profiles: [dev]
    container_name: psx-proxy-dev
    build:
      context: ./backend         # build context is the backend/ subfolder
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux Docker support (no-op on Docker Desktop)
    ports:
      - "4000:4000"              # host:4000 → proxy → scraper / csapis.com
    environment:
      - PROXY_PORT=4000
      - CAPITALSTAKE_API_KEY=${CAPITALSTAKE_API_KEY:-}
      - ALLOWED_ORIGIN=http://localhost:3000
      # PSX scraper URL — reachable from inside Docker via host.docker.internal
      - PSX_SCRAPER_URL=${PSX_SCRAPER_URL:-http://host.docker.internal:4001}
      # Auth + portfolio storage: DB_HOST only (a profile-specific literal —
      # `environment:` beats `env_file:`). Credentials and JWT_SECRET arrive from
      # .env.local via env_file below; the backend composes DATABASE_URL from
      # DB_HOST + POSTGRES_* and fails fast at boot if anything is missing.
      - DB_HOST=db-dev
    env_file:
      - path: .env.local
        required: true
    depends_on:
      db-dev:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Production: PostgreSQL ────────────────────────────────────────────────
  db-prod:
    profiles: [prod]
    container_name: psx-db-prod
    image: postgres:16-alpine
    # No published host port: reachable only on the compose network.
    env_file:
      - path: .env.local
        required: true      # set a real POSTGRES_PASSWORD for the prod profile
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Production: React app (multi-stage → Nginx) ───────────────────────────
  app-prod:
    profiles: [prod]
    container_name: psx-prod
    build:
      context: ./frontend        # build context is the frontend/ subfolder
      dockerfile: Dockerfile
      # VITE_* vars must be baked at build time (Vite bundles them into JS)
      args:
        VITE_MARKET_PROVIDER: ${VITE_MARKET_PROVIDER:-mock}
        VITE_PROXY_BASE_URL: ${VITE_PROXY_BASE_URL:-http://localhost:4000}
    ports:
      - "80:80"                  # host:80 → Nginx
    environment:
      - NODE_ENV=production
    env_file:
      - path: .env.local
        required: false
    depends_on:
      proxy-prod:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Production: Market data proxy ─────────────────────────────────────────
  proxy-prod:
    profiles: [prod]
    container_name: psx-proxy-prod
    build:
      context: ./backend         # build context is the backend/ subfolder
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux Docker support (no-op on Docker Desktop)
    ports:
      - "4000:4000"
    environment:
      - PROXY_PORT=4000
      - CAPITALSTAKE_API_KEY=${CAPITALSTAKE_API_KEY:-}
      - ALLOWED_ORIGIN=http://localhost:80
      - PSX_SCRAPER_URL=${PSX_SCRAPER_URL:-http://host.docker.internal:4001}
      - DB_HOST=db-prod
    env_file:
      - path: .env.local
        required: true
    depends_on:
      db-prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  node_modules_dev:
    name: psx_node_modules_dev
  # Compose prefixes these with the project name (e.g.
  # psx-portfolio-manager-ayyan_pgdata_dev), so every checkout gets its own DB
  # data and `down -v` is the only thing that wipes it.
  pgdata_dev:
  pgdata_prod:
