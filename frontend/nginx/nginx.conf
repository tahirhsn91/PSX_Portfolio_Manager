# =============================================================================
# Nginx config for PSX Portfolio Manager (Single Page Application)
#
# Key behaviours:
#   • All unknown routes fall back to /index.html (React Router support)
#   • Gzip compression for text assets
#   • Long-lived cache for hashed JS/CSS bundles, no-cache for index.html
#   • Basic security headers (HSTS, X-Frame-Options, CSP, etc.)
# =============================================================================

# `map` is valid in the http context, where conf.d/*.conf is included, so it may live
# beside the server block that uses it.
#
# Only send `Connection: upgrade` when the client actually asked to upgrade. A hardcoded
# "upgrade" on every request (including plain HTTP ones) confuses upstreams that don't
# speak WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the scheme the *client* used: the host nginx sets X-Forwarded-Proto, while a
# direct hit on this container sets nothing — fall back to this connection's own scheme
# rather than forwarding an empty header.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-Frame-Options           "SAMEORIGIN"      always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy — adjust if you later add an external API origin
    #
    # ONE LINE, DELIBERATELY. nginx does NOT strip a backslash-newline inside a quoted
    # string: the header is emitted with literal "\<newline>         " sequences, each
    # continuation line beginning with a space. Any reverse proxy in front of this
    # container then rejects the whole response —
    #   upstream sent invalid header: "\x20..." while reading response header from upstream
    # — and answers 502. (Splitting it over lines "for readability" is exactly how this
    # happened; it is invisible until something in front of the container reads the header.)
    #
    # NOTE ON SCOPE: nginx does not inherit add_header into a location that declares its
    # own, so `location = /index.html` (below) and the asset locations drop every header
    # in this block — index.html ships with no CSP at all today. Re-adding the policy to
    # those locations would start enforcing it on the document for the first time, which
    # can break third-party script/font loads; that is a deliberate decision to make, not
    # a formatting fix. What is fixed here is that responses which DO carry the header are
    # no longer malformed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # ── Caching strategy ─────────────────────────────────────────────────────

    # index.html — never cache (always fetch fresh so new deploys take effect)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires    0;
    }

    # Vite outputs content-hashed filenames (e.g. main.Xr23kQ.js)
    # → safe to cache for 1 year
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and other media
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Backend proxy passthrough ─────────────────────────────────────────────
    # The app is built with an EMPTY VITE_PROXY_BASE_URL (frontend/.env.production), so it
    # calls /api/auth/*, /api/psx/*, /api/cs/* and /api/sarmaaya/* on whatever host served
    # the page — and this location forwards them to the backend proxy.
    #
    # Why here and not at the host's nginx: VITE_* values are baked into the bundle at
    # build time, so an absolute base URL (http://<host>:6101) pins the app to one origin.
    # Served from https://manager.myportfolio365.com every call was refused before it left
    # the browser — mixed content (https page → http URL), then no CORS match, then this
    # container's own CSP `connect-src 'self'`. Same-origin satisfies all three, keeps that
    # CSP valid as written, and makes the image domain-agnostic.
    #
    # A prefix location, matched before the SPA fallback below — otherwise /api/... would
    # be answered with index.html (HTTP 200 + text/html), surfacing as a JSON parse error
    # rather than a real status code.
    location /api/ {
        # Docker's embedded DNS. nginx resolves an upstream name ONCE, at startup; with a
        # literal `proxy_pass http://proxy-prod:4000`, recreating the backend container
        # (what a deploy does) leaves this pointing at the old IP and 502-ing. Resolving
        # through a variable re-looks-up per request. `proxy-prod` is the compose service
        # name, so it resolves on the compose network regardless of the container_name the
        # per-checkout override sets.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $proxy_upstream http://proxy-prod:4000;

        # No URI part → the original path is forwarded unchanged (/api/auth/me stays
        # /api/auth/me), which is the prefix the backend proxy serves.
        proxy_pass $proxy_upstream;
        proxy_http_version 1.1;

        # Session cookies and the real client IP both cross this hop. The backend composes
        # its CORS from ALLOWED_ORIGIN, and signed-in sessions are cookie-based, so the
        # Host/Origin chain has to stay intact.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Any path that doesn't match a static file is served as index.html
    # so React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health-check endpoint ─────────────────────────────────────────────────
    # Used by Docker HEALTHCHECK and load-balancer probes.
    location /health {
        access_log  off;
        return      200 "OK\n";
        add_header  Content-Type text/plain;
    }

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
