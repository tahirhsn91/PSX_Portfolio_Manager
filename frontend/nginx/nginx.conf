# =============================================================================
# Nginx config for PSX Portfolio Manager (Single Page Application)
#
# Key behaviours:
#   • All unknown routes fall back to /index.html (React Router support)
#   • Gzip compression for text assets
#   • Long-lived cache for hashed JS/CSS bundles, no-cache for index.html
#   • Basic security headers (HSTS, X-Frame-Options, CSP, etc.)
# =============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-Frame-Options           "SAMEORIGIN"      always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy — adjust if you later add an external API origin
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob:; \
         font-src 'self' data:; \
         connect-src 'self'; \
         frame-ancestors 'none';"
        always;

    # ── Caching strategy ─────────────────────────────────────────────────────

    # index.html — never cache (always fetch fresh so new deploys take effect)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires    0;
    }

    # Vite outputs content-hashed filenames (e.g. main.Xr23kQ.js)
    # → safe to cache for 1 year
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and other media
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Any path that doesn't match a static file is served as index.html
    # so React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health-check endpoint ─────────────────────────────────────────────────
    # Used by Docker HEALTHCHECK and load-balancer probes.
    location /health {
        access_log  off;
        return      200 "OK\n";
        add_header  Content-Type text/plain;
    }

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
